    <!-- beranda -->
    <div class="halaman" id="beranda">
        <header class="efek-cahaya">
            <div class="nav-header">
                <h3>Catatan <span>Udin</span></h3>
            </div>

            <div class="isi-header">
                <div class="kiri-header">
                    <div class="saldo">
                        <span>Rp</span>
                        <p id="saldo-atas"></p>
                    </div>
                    <a href="">Ke Riwayat Keuangan ></a>
                </div>
                <div class="tambahkurang">
                    <button class="tambah btn-header" id="tambahtambah" onclick="tampilkanTambah()">
                        <span>(+)</span><span>Tambahkan</span>
                    </button>
                    <button class="kurang btn-header" id="kurangkurang" onclick="tampilkanTambah()">
                        <span>(-)</span>Kurangkan
                    </button>
                </div>
            </div>
        </header>
        <div class="container   ">
            <div class="dataatas container-card">
                <div class="masuk card">
                    <span>Masuk</span>
                    <p id="uang-masuk"></p>
                </div>
                <div class="keluar card">
                    <span>Keluar</span>
                    <p id="uang-keluar"></p>
                </div>
            </div>
            <div class="transaksi-terkini">
                <ul class="data-terkini container-card" id="data-terkini">
                    <!-- <li class="data1 card-data">
                        <h3>Makan</h3>
                        <div>
                            <span id="data-keluar">-Rp13.000.000.000</span>
                            <p id="data-waktu">⏰ 13:09</p>
                        </div>
                    </li>
                    <li class="data2 card-data">
                        <h3>Kuota</h3>
                        <div>
                            <span id="data-masuk">+Rp10.000</span>
                            <p id="data-waktu">⏰ 10:20</p>
                        </div>

                    </li> -->
                </ul>
            </div>
        </div>
    </div>


    <!-- riwayat -->
    <div class="halaman" id="riwayat">
        <div class="container-full">
            <div class="header-riwayat">
                <h3>Riwayat Transaksi</h3>

            </div>
            <ul class="container-card" id="wadah">

            </ul>
            <div id="buttonmuat" class="container-card">
                <button type="button" id="btnMuatLebih" style="display: none;">Muat Lebih Banyak</button>
            </div>
        </div>
    </div>


    <!-- list biaya yang harus dipenuhi -->
    <div class="halaman" id="biaya">
        <div class="container-full">
            <div class="header-biaya">
                <h3>List biaya</h3>

            </div>
            <div class="container-card">
                <div class="riwayat-container">
                    <h3>Sekolah</h3>
                </div>
                <div class="isi-riwayat">
                    <div class="info-riwayat">
                        <p>Parkir / minggu</p>
                        <p id="data-keluar">Rp<span>15.000</span></p>
                    </div>
                    <div class="info-riwayat">
                        <p>kas / bulan</p>
                        <p id="data-keluar">Rp<span>10.000</span></p>
                    </div>
                    <div class="info-riwayat">
                        <p>bensin / 2 minggu</p>
                        <p id="data-keluar">Rp<span>35.000</span></p>
                    </div>
                </div>
            </div>
            <br>
            <div class="container-card">
                <div class="riwayat-container">
                    <h3>Total biaya/bulan</h3>
                </div>
                <div class="isi-riwayat">
                    <div class="info-riwayat">
                        <h1 id="data-keluar">Rp<span>140k</span></>
                    </div>

                </div>
            </div>
        </div>
    </div>


    <!-- Notiffikasi tambahkan uang -->
    <div class="tambahkan container-input hilang" id="notif-tambahkan">
        <input type="text" inputmode="numeric" pattern="[0-9]*" oninput="formatRupiah(this)" class="tambahkan-uang"
            id="jumlahUang" placeholder="Masukan Jumlah uang di sini">
        <div class="kategori container-kategori hilang" id="kategori"></div>

        <button class="tambah-kategori">Tambahkan Kategori</button>
        <div class="bawah-kategori container-kategori">
            <h3>Tanggal</h3>
            <input type="date" class="kategori-card" name="" id="tanggal">
            <h3>Keterangan Tambahan</h3>
            <input type="text" class="tambahkan-uang" id="keterangan">
        </div>
        <div class="penting-tambahkanUang">
            <button class="simpan tambah-kategori">Simpan</button>
            <button class="keluarTambahkan tambah-kategori">Keluar</button>
        </div>
    </div>
